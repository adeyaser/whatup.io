<!-- FIXED Modal HTML - Replace the old #members-modal with this -->
<!-- This has flex-shrink: 0 on form and min-height: 0 on table container -->

<div id="members-modal" class="modal-overlay"
    style="display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(3px);">
    <div class="card"
        style="width: 650px; max-height: 85vh; display: flex; flex-direction: column; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <!-- Header -->
        <header
            style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem; border-bottom: 2px solid #e2e8f0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 12px 12px 0 0; flex-shrink: 0;">
            <div>
                <h3 id="members-modal-title" style="margin: 0; font-size: 1.3rem; font-weight: 600;">Group Members
                </h3>
                <p style="margin: 0.25rem 0 0 0; font-size: 0.85rem; opacity: 0.9;">Manage your group contacts</p>
            </div>
            <button onclick="closeMembersModal()"
                style="background: rgba(255,255,255,0.2); border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; transition: all 0.2s;"
                onmouseover="this.style.background='rgba(255,255,255,0.3)'"
                onmouseout="this.style.background='rgba(255,255,255,0.2)'">&times;</button>
        </header>

        <!-- Add Member Form - flex-shrink: 0 to prevent collapse -->
        <div style="padding: 1.5rem; background: #f8fafc; border-bottom: 1px solid #e2e8f0; flex-shrink: 0;">
            <div style="margin-bottom: 1rem;">
                <label
                    style="display: block; font-weight: 600; color: #475569; margin-bottom: 0.5rem; font-size: 0.9rem;">Phone
                    Number</label>
                <input type="text" id="new-member-number" placeholder="628123456789"
                    style="width: 100%; padding: 1rem; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; transition: all 0.2s; box-sizing: border-box;"
                    onfocus="this.style.borderColor='#667eea'; this.style.boxShadow='0 0 0 3px rgba(102,126,234,0.1)'"
                    onblur="this.style.borderColor='#e2e8f0'; this.style.boxShadow='none'">
            </div>
            <div style="margin-bottom: 1rem;">
                <label
                    style="display: block; font-weight: 600; color: #475569; margin-bottom: 0.5rem; font-size: 0.9rem;">Name
                    (Optional)</label>
                <input type="text" id="new-member-name" placeholder="Enter name"
                    style="width: 100%; padding: 1rem; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; transition: all 0.2s; box-sizing: border-box;"
                    onfocus="this.style.borderColor='#667eea'; this.style.boxShadow='0 0 0 3px rgba(102,126,234,0.1)'"
                    onblur="this.style.borderColor='#e2e8f0'; this.style.boxShadow='none'">
            </div>
            <button id="add-member-btn" class="btn-primary" onclick="addMember()" type="button"
                style="width: 100%; padding: 1rem; border-radius: 8px; font-weight: 600; font-size: 1.1rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(102,126,234,0.3);"
                onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(102,126,234,0.4)'"
                onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(102,126,234,0.3)'">
                <span style="font-size: 1.2rem;">+</span> Add Member
            </button>
        </div>

        <!-- Members List - min-height: 0 for flex to work -->
        <div style="overflow-y: auto; flex: 1; padding: 1rem; min-height: 0;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #f1f5f9; border-radius: 6px;">
                        <th
                            style="padding: 0.75rem; text-align: left; font-weight: 600; color: #475569; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">
                            Phone Number</th>
                        <th
                            style="padding: 0.75rem; text-align: left; font-weight: 600; color: #475569; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">
                            Name</th>
                        <th
                            style="padding: 0.75rem; text-align: right; font-weight: 600; color: #475569; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">
                            Action</th>
                    </tr>
                </thead>
                <tbody id="members-table-body">
                    <!-- Members will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>
</div>
