<!DOCTYPE html>
<html>
<head>
    <title>Table Render Test</title>
    <style>
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; border: 1px solid #ccc; text-align: left; }
        th { background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Test 1: Hardcoded Table</h1>
    <table>
        <thead>
            <tr><th>Name</th><th>Value</th></tr>
        </thead>
        <tbody>
            <tr><td>Item 1</td><td>Value 1</td></tr>
            <tr><td>Item 2</td><td>Value 2</td></tr>
        </tbody>
    </table>

    <h1>Test 2: Dynamically Created Table</h1>
    <table id="dynamic-table">
        <thead>
            <tr><th>Name</th><th>Value</th></tr>
        </thead>
        <tbody id="test-tbody"></tbody>
    </table>

    <h1>Test 3: Modal-like Container</h1>
    <div style="border: 1px solid #ccc; width: 600px; max-height: 400px; display: flex; flex-direction: column; margin-top: 20px;">
        <div style="padding: 1rem; background: #667eea; color: white;">Modal Header</div>
        <div style="overflow-y: auto; flex: 1; padding: 1rem;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #f1f5f9;">
                        <th style="padding: 0.75rem; text-align: left;">Phone</th>
                        <th style="padding: 0.75rem; text-align: left;">Name</th>
                    </tr>
                </thead>
                <tbody id="modal-tbody">
                    <!-- Members inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Test 2: Dynamic insertion
        const tbody2 = document.getElementById('test-tbody');
        for (let i = 1; i <= 3; i++) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>Dynamic ${i}</td><td>Value ${i}</td>`;
            tbody2.appendChild(tr);
        }

        // Test 3: Modal-like dynamic insertion
        const tbody3 = document.getElementById('modal-tbody');
        const members = [
            { number: '628123', name: 'John' },
            { number: '628456', name: 'Jane' },
            { number: '628789', name: 'Bob' }
        ];
        
        members.forEach((m, idx) => {
            const tr = document.createElement('tr');
            tr.style.backgroundColor = 'white';
            tr.innerHTML = `
                <td style="padding: 1rem; border-bottom: 1px solid #e2e8f0;">
                    <span style="background: #eff6ff; color: #3b82f6; padding: 0.25rem 0.75rem; border-radius: 6px;">
                        ${m.number}
                    </span>
                </td>
                <td style="padding: 1rem; border-bottom: 1px solid #e2e8f0;">${m.name}</td>
            `;
            tbody3.appendChild(tr);
            console.log(`Appended member ${idx + 1}, tbody3 now has ${tbody3.children.length} rows`);
        });

        console.log('All tests rendered. Check if all tables are visible.');
    </script>
</body>
</html>
