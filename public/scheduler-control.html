<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduler Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .status-card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .status-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .status-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .status-item label {
            display: block;
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .status-item .value {
            font-size: 20px;
            font-weight: bold;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-indicator.running {
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .status-indicator.stopped {
            background: #f87171;
            box-shadow: 0 0 10px #f87171;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: white;
        }

        .btn-stop {
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
            color: white;
        }

        .btn-trigger {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
        }

        .btn-refresh {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            color: white;
        }

        .config-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e5e7eb;
        }

        .config-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #666;
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input {
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .btn-update {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .alert.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .alert.info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .token-input {
            margin-bottom: 30px;
        }

        .token-input input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }

        .token-input input:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎛️ Scheduler Control Panel</h1>
        <p class="subtitle">Kontrol Message Retry Scheduler</p>

        <div class="alert" id="alert"></div>

        <div class="token-input">
            <label for="token" style="display: block; margin-bottom: 8px; color: #666; font-weight: 600;">JWT Token:</label>
            <input type="password" id="token" placeholder="Masukkan JWT token Anda...">
        </div>

        <div class="status-card">
            <h2>📊 Status Scheduler</h2>
            <div class="status-info">
                <div class="status-item">
                    <label>Status</label>
                    <div class="value">
                        <span class="status-indicator stopped" id="statusIndicator"></span>
                        <span id="statusText">Loading...</span>
                    </div>
                </div>
                <div class="status-item">
                    <label>Processing</label>
                    <div class="value" id="processingText">-</div>
                </div>
                <div class="status-item">
                    <label>Interval</label>
                    <div class="value" id="intervalText">-</div>
                </div>
                <div class="status-item">
                    <label>Batch Size</label>
                    <div class="value" id="batchText">-</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-start" onclick="startScheduler()">
                <span>▶️</span> Start Scheduler
            </button>
            <button class="btn-stop" onclick="stopScheduler()">
                <span>⏹️</span> Stop Scheduler
            </button>
            <button class="btn-trigger" onclick="triggerRetry()">
                <span>⚡</span> Trigger Retry
            </button>
            <button class="btn-refresh" onclick="refreshStatus()">
                <span>🔄</span> Refresh Status
            </button>
        </div>

        <div class="config-section">
            <h3>⚙️ Konfigurasi Scheduler</h3>
            <div class="config-grid">
                <div class="form-group">
                    <label>Enabled</label>
                    <input type="checkbox" id="configEnabled" checked>
                </div>
                <div class="form-group">
                    <label>Batch Size</label>
                    <input type="number" id="configBatchSize" value="5" min="1" max="50">
                </div>
                <div class="form-group">
                    <label>Interval (minutes)</label>
                    <input type="number" id="configInterval" value="30" min="1" max="1440">
                </div>
                <div class="form-group">
                    <label>Min Delay (seconds)</label>
                    <input type="number" id="configMinDelay" value="30" min="1" max="300">
                </div>
                <div class="form-group">
                    <label>Max Delay (seconds)</label>
                    <input type="number" id="configMaxDelay" value="60" min="1" max="300">
                </div>
                <div class="form-group">
                    <label>Max Retries</label>
                    <input type="number" id="configMaxRetries" value="3" min="1" max="10">
                </div>
                <div class="form-group">
                    <label>Cooldown (minutes)</label>
                    <input type="number" id="configCooldown" value="5" min="1" max="60">
                </div>
            </div>
            <button class="btn-update" onclick="updateSettings()" style="width: 100%;">
                <span>💾</span> Update Settings
            </button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';

        function getToken() {
            return document.getElementById('token').value.trim();
        }

        function showAlert(message, type = 'info') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        function setButtonLoading(button, loading) {
            if (loading) {
                button.disabled = true;
                button.innerHTML = '<span class="loading"></span> Loading...';
            } else {
                button.disabled = false;
            }
        }

        async function apiCall(endpoint, method = 'GET', body = null) {
            const token = getToken();
            if (!token) {
                showAlert('Silakan masukkan JWT token terlebih dahulu!', 'error');
                return null;
            }

            try {
                const options = {
                    method,
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                };

                if (body) {
                    options.body = JSON.stringify(body);
                }

                const response = await fetch(`${API_BASE}${endpoint}`, options);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Request failed');
                }

                return data;
            } catch (error) {
                showAlert(`Error: ${error.message}`, 'error');
                return null;
            }
        }

        async function refreshStatus() {
            const data = await apiCall('/scheduler/status');
            if (data && data.status) {
                updateStatusDisplay(data.data);
                showAlert('Status berhasil direfresh!', 'success');
            }
        }

        function updateStatusDisplay(statusData) {
            const { running, isProcessing, config } = statusData;

            // Update status indicator
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            
            if (running) {
                indicator.className = 'status-indicator running';
                statusText.textContent = 'Running';
            } else {
                indicator.className = 'status-indicator stopped';
                statusText.textContent = 'Stopped';
            }

            // Update processing status
            document.getElementById('processingText').textContent = isProcessing ? 'Yes' : 'No';

            // Update config display
            document.getElementById('intervalText').textContent = `${config.interval_minutes} min`;
            document.getElementById('batchText').textContent = config.batch_size;

            // Update form inputs
            document.getElementById('configEnabled').checked = config.enabled;
            document.getElementById('configBatchSize').value = config.batch_size;
            document.getElementById('configInterval').value = config.interval_minutes;
            document.getElementById('configMinDelay').value = config.min_delay_seconds;
            document.getElementById('configMaxDelay').value = config.max_delay_seconds;
            document.getElementById('configMaxRetries').value = config.max_retries;
            document.getElementById('configCooldown').value = config.cooldown_minutes;
        }

        async function startScheduler() {
            const data = await apiCall('/scheduler/start', 'POST');
            if (data) {
                if (data.status) {
                    showAlert('✅ ' + data.message, 'success');
                    updateStatusDisplay(data.data);
                } else {
                    showAlert('⚠️ ' + data.message, 'info');
                }
            }
        }

        async function stopScheduler() {
            const data = await apiCall('/scheduler/stop', 'POST');
            if (data) {
                if (data.status) {
                    showAlert('✅ ' + data.message, 'success');
                    updateStatusDisplay(data.data);
                } else {
                    showAlert('⚠️ ' + data.message, 'info');
                }
            }
        }

        async function triggerRetry() {
            const data = await apiCall('/scheduler/trigger', 'POST');
            if (data && data.status) {
                showAlert('✅ Retry cycle triggered! Cek console log server.', 'success');
            }
        }

        async function updateSettings() {
            const settings = {
                enabled: document.getElementById('configEnabled').checked,
                batch_size: parseInt(document.getElementById('configBatchSize').value),
                interval_minutes: parseInt(document.getElementById('configInterval').value),
                min_delay_seconds: parseInt(document.getElementById('configMinDelay').value),
                max_delay_seconds: parseInt(document.getElementById('configMaxDelay').value),
                max_retries: parseInt(document.getElementById('configMaxRetries').value),
                cooldown_minutes: parseInt(document.getElementById('configCooldown').value)
            };

            const data = await apiCall('/scheduler/settings', 'POST', settings);
            if (data && data.status) {
                showAlert('✅ Settings berhasil diupdate!', 'success');
                updateStatusDisplay(data.data);
            }
        }

        // Auto-refresh status on load
        window.addEventListener('load', () => {
            // Check if token is saved in localStorage
            const savedToken = localStorage.getItem('jwt_token');
            if (savedToken) {
                document.getElementById('token').value = savedToken;
                refreshStatus();
            }
        });

        // Save token to localStorage when changed
        document.getElementById('token').addEventListener('change', (e) => {
            localStorage.setItem('jwt_token', e.target.value);
        });
    </script>
</body>
</html>
